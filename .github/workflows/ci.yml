name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, elaborate, and check generated collateral
    runs-on: ubuntu-latest
    # Chisel's FIRRTL converter recurses over expression trees, and Iris's are deep
    # enough to overflow the runner's default 1 MB stack inside Converter.convertPrim,
    # aborting the suite before a single test runs. How much stack a walk needs is not
    # fixed: each level is ~8 frames of Scala collection plumbing that the JIT collapses
    # once it compiles them, so a cold JVM spends several times more stack than a warm
    # one on the same design. 8m was enough on one run and overflowed on the next from
    # an identical tree, so this is sized to sit well clear of that edge rather than
    # just past it. The heap goes up too: a runner defaults to a quarter of its 16 GB,
    # which is tight for elaborating a chip top. JAVA_TOOL_OPTIONS is what reaches the
    # JVM mill forks to run the tests in, which is where elaboration happens.
    env:
      JAVA_TOOL_OPTIONS: -Xmx6g -Xss64m
    steps:
      - uses: actions/checkout@v4

      # The .gitmodules URLs are SSH, but every submodule below is a public
      # repo, so rewrite to HTTPS instead of giving the runner a deploy key.
      # DRAMSim2 and tacit_decoder are simulation-only and not in the mill
      # build, so they stay uninitialized.
      - name: Check out submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init \
            rocket-chip shuttle saturn-vectors testchipip ucie tacit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Dominated by the Chisel/rocket-chip artifacts and the firtool binary
      # Chisel resolves at elaboration time.
      - name: Cache JVM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', 'module.mill') }}
          restore-keys: ${{ runner.os }}-mill-

      # Elaboration shells out to the device tree compiler, which rocket-chip runs to
      # build the DTB the boot ROM embeds, and it is not on the runner image. Installing
      # it through apt would cost an `apt-get update` first -- tens of MB of indexes to
      # land 223 KB of dtc -- so fetch the package and its two dependencies from the
      # archive pool instead. Pinned by version and checksum, which is also what makes
      # the plain-HTTP fetch safe; apt verifies its downloads the same way. If the pool
      # ever drops these versions the curl 404s and the apt path takes over.
      - name: Install the device tree compiler
        run: |
          set -euo pipefail
          pool=http://archive.ubuntu.com/ubuntu/pool/main
          cd "$(mktemp -d)"
          if curl -fsSLO "$pool/d/device-tree-compiler/device-tree-compiler_1.7.0-2build1_amd64.deb" \
             && curl -fsSLO "$pool/d/device-tree-compiler/libfdt1_1.7.0-2build1_amd64.deb" \
             && curl -fsSLO "$pool/liby/libyaml/libyaml-0-2_0.2.5-1build1_amd64.deb"; then
            sha256sum --check <<'SUMS'
          b2c1e8c86f18b6bda26408f92bfb9ec1a1e40bfdc41f1034600ccd68e82d2ed7  device-tree-compiler_1.7.0-2build1_amd64.deb
          274d20dfab9d6b216b5de85446a93f6ce5b2cd82c847b8dfdc508577f76eb96a  libfdt1_1.7.0-2build1_amd64.deb
          f5271b120d936dcc7ddf17b9e718df41d55386a6075555d0c634925eaef0b2ac  libyaml-0-2_0.2.5-1build1_amd64.deb
          SUMS
            sudo dpkg -i ./*.deb
          else
            echo "Archive pool no longer serves the pinned versions; falling back to apt."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends device-tree-compiler
          fi
          dtc --version

      # Constellation builds its routing tables with Chisel's `decoder`, which uses
      # espresso when it is on the PATH and otherwise falls back to Quine-McCluskey
      # with nothing but a logged error. QMC is exponential on tables this size, so
      # the fallback exhausts the runner's heap and aborts the suite.
      - name: Install espresso
        env:
          ESPRESSO_SHA256: 7683c4315e1c9cec293c194eb6a1ed716d22a9952a96bd88bff62ecf57df6e2f
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/espresso" \
            https://github.com/chipsalliance/espresso/releases/download/v2.4/x86_64-linux-gnu-espresso
          echo "$ESPRESSO_SHA256  $HOME/.local/bin/espresso" | sha256sum --check
          chmod +x "$HOME/.local/bin/espresso"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile
        run: ./mill test.compile

      # Elaboration only. The rest of IrisSpec drives VCS and needs RISC-V
      # binaries, so it stays out of CI.
      - name: Elaborate Iris
        run: |
          ./mill test.testOnly edu.berkeley.cs.iris.IrisSpec \
            -- -t "Iris should generate valid System Verilog"

      - name: Elaborate IrisDryRun
        run: |
          ./mill test.testOnly edu.berkeley.cs.iris.IrisSpec \
            -- -t "IrisDryRun should generate valid System Verilog"

      - name: Elaborate TinyIris
        run: |
          ./mill test.testOnly edu.berkeley.cs.iris.IrisSpec \
            -- -t "TinyIris should generate valid System Verilog for TinyIris"

      # PD hardens the two UCIe blocks as one hierarchical block, so both links
      # have to sit inside a single UcieComplex module and share one UcieTL.
      # Giving a port its own UcieTLParams.moduleId splits them again, and
      # nothing else in the flow would notice.
      - name: Check the UCIe blocks are grouped and deduped
        run: |
          out=build/Iris_should_generate_valid_System_Verilog
          n=$(grep -lE '^module UcieTL(_[A-Za-z0-9]+)?\(' "$out"/*.sv | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected 1 UcieTL module in $out, found $n"
            grep -hE '^module UcieTL(_[A-Za-z0-9]+)?\(' "$out"/*.sv || true
            exit 1
          fi
          if [ ! -f "$out/UcieComplex.sv" ]; then
            echo "::error::expected a UcieComplex wrapper module in $out"
            exit 1
          fi
          links=$(grep -cE '^ *UcieChipletLink(_[A-Za-z0-9]+)? ' "$out/UcieComplex.sv" || true)
          if [ "$links" -ne 2 ]; then
            echo "::error::expected 2 UCIe links inside UcieComplex, found $links"
            exit 1
          fi

      # Catches a ucie bump (or a UCIe parameter change) that moves the
      # register map without the checked-in header following it.
      - name: Check ucie.h is up to date
        run: |
          ./mill runMain edu.berkeley.cs.iris.GenUcieHeader "$RUNNER_TEMP/ucie.h"
          if ! diff -u software/ucie.h "$RUNNER_TEMP/ucie.h"; then
            echo "::error::software/ucie.h is stale; run 'make ucie.h' in software/"
            exit 1
          fi
